[package]
name = "sindr"
version = "0.1.0"
edition = "2021"
description = "Shared Surtr foundations: IR, runtime values, and builtin metadata"

[dependencies]
bincode = "1.3.3"
schemars = { version = "0.8", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-bigint = { workspace = true }
num-traits = { workspace = true }
