[package]
name = "sindr"
version = "0.1.0"
edition = "2021"
description = "Shared Surtr foundations: IR, runtime values, and builtin metadata"

[features]
default = []
viewer-schema = ["dep:schemars"]

[dependencies]
bincode = "1.3.3"
schemars = { version = "0.8", features = ["derive"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-bigint = { workspace = true }
num-traits = { workspace = true }

[[example]]
name = "export_viewer_schema"
required-features = ["viewer-schema"]
