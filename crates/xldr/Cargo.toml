[package]
name = "xldr"
version = "0.1.0"
edition = "2021"
description = "Interactive and eXtensible surtr and eLDR runtime tools"

[features]
default = ["line-editor"]
line-editor = ["dep:rustyline", "dep:crossterm"]
tui = ["dep:ratatui", "dep:crossterm"]
bench = ["dep:criterion"]

[dependencies]
diagnostics = { path = "../diagnostics" }
spire = { path = "../spire" }
sigil = { path = "../sigil" }
scar = { path = "../scar" }
forge = { path = "../forge" }
eldr = { path = "../eldr" }
sindr = { path = "../sindr" }
bincode = "1.3.3"
serde = { version = "1.0", features = ["derive"] }
rustyline = { version = "13", optional = true }
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
criterion = { version = "0.5", optional = true }

[[bench]]
name = "tco"
harness = false
required-features = ["bench"]
