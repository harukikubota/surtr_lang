[package]
name = "rune"
version = "0.1.0"
edition = "2021"
description = "Runtime User-facing Node Entry — the Surtr CLI"

[features]
default = ["line-editor"]
line-editor = ["xldr/line-editor"]
tui = ["xldr/tui"]

[[bin]]
name = "surtr"
path = "src/main.rs"

[dependencies]
diagnostics = { path = "../diagnostics" }
spire = { path = "../spire" }
sigil = { path = "../sigil" }
scar  = { path = "../scar" }
forge = { path = "../forge" }
eldr  = { path = "../eldr" }
sindr = { path = "../sindr" }
xldr  = { path = "../xldr" }
serde_json = "1.0"
terminal_size = "0.4"
unicode-width = "0.2"

[dev-dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3.3"
sha2 = "0.10"
scar-test-cache-key = { path = "../scar/tests/cache-key" }

[[example]]
name = "scar-test-prewarm"
test = false

[[test]]
name = "integration"
path = "../../tests/integration/all.rs"
