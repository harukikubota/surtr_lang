[package]
name = "rune"
version = "0.1.0"
edition = "2021"
description = "Runtime User-facing Node Entry — the Surtr CLI"

[features]
default = ["line-editor"]
line-editor = ["xldr/line-editor"]
tui = ["xldr/tui"]

[[bin]]
name = "surtr"
path = "src/main.rs"

[dependencies]
diagnostics = { path = "../diagnostics" }
spire = { path = "../spire" }
sigil = { path = "../sigil" }
scar  = { path = "../scar" }
forge = { path = "../forge" }
eldr  = { path = "../eldr" }
sindr = { path = "../sindr" }
xldr  = { path = "../xldr" }
serde_json = "1.0"

[[test]]
name = "integration"
path = "../../tests/integration/all.rs"
