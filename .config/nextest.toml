[profile.default]
fail-fast = false
slow-timeout = { period = "15s", terminate-after = 1, grace-period = "0s" }
status-level = "pass"
final-status-level = "slow"
default-filter = 'not (test(/^run_eldr::/) | test(/^build_roundtrip::/) | test(/^repl::/) | test(/^test_command::/) | test(/^tui::/))'

[profile.ci]
default-filter = 'all()'
# A clean, fully parallel build can take longer than nextest's 100ms default
# to close a just-finished test process's stdout/stderr on macOS. Keep leak
# detection enabled, but allow a bounded shutdown window before reporting it.
leak-timeout = "1s"

[profile.cold]
default-filter = 'test(/^run_eldr::/) | test(/^build_roundtrip::/) | test(/^repl::/) | test(/^test_command::/) | test(/^tui::/)'

[[profile.default.overrides]]
filter = 'test(/^run_eldr::/) | test(/^build_roundtrip::/) | test(/^repl::/) | test(/^test_command::/) | test(/^tui::/)'
threads-required = 2

[[profile.ci.overrides]]
filter = 'test(/^run_eldr::/) | test(/^build_roundtrip::/) | test(/^repl::/) | test(/^test_command::/) | test(/^tui::/)'
threads-required = 2
